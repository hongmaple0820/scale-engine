name: Source CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: SCALE source fast-lane preflight
        id: gate-fast-lane
        run: |
          set +e
          set -o pipefail
          timeout 420s node dist/api/cli.js preflight --json --profile ci --preflight-profile fast-lane 2>&1 | tee gate-fast-lane.log
          status=${PIPESTATUS[0]}
          {
            echo "## SCALE fast-lane preflight"
            cat gate-fast-lane.log
            echo
            echo "Exit code: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload fast-lane gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ci-${{ matrix.os }}-gate-fast-lane
          path: gate-fast-lane.log
          retention-days: 30

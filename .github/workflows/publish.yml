name: Publish npm package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate publish prerequisites
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Cannot publish."
            exit 1
          fi

      - name: Validate release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Governance health
        run: |
          npm run learning:health
          npm run docs:health

      - name: Full release gate
        # Includes health checks, lint, typecheck, tests, install/provider smokes,
        # build, golden eval, audit, package smoke, npm pack, and DSH plugin checks.
        run: npm run release:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@hongmaple0820/scale-engine@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "scale-engine@$LOCAL already published — skipping (release completed out-of-band)."
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Extract changelog section for this version
          NOTES=$(awk "/^## ${VERSION} -/{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "${NOTES:-Release v${VERSION}}"
          fi

  publish-plugin:
    name: Publish dsh-scale plugin
    runs-on: ubuntu-latest
    environment: npm
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Build main package (plugin typecheck resolves dist types)
        run: |
          npm ci
          npm run build

      - name: Build plugin
        working-directory: packages/dsh-scale
        run: |
          npm install
          npm run build
          npm pack --dry-run

      - name: Publish plugin
        working-directory: packages/dsh-scale
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@hongmaple0820/dsh-scale@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "dsh-scale@$LOCAL already published — skipping."
          else
            npm publish --access public
          fi

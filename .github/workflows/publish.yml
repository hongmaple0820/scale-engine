name: Publish npm package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate publish prerequisites
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Cannot publish."
            exit 1
          fi

      - name: Validate release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Governance health
        run: |
          npm run learning:health
          npm run docs:health

      - name: Full release gate
        # Includes health checks, lint, typecheck, tests, install/provider smokes,
        # build, golden eval, audit, package smoke, npm pack, and DSH plugin checks.
        run: npm run release:check

      - name: Pack DSH plugin before publishing the main package
        working-directory: packages/dsh-scale
        run: |
          mkdir -p "$RUNNER_TEMP/scale-release-packages"
          npm pack --pack-destination "$RUNNER_TEMP/scale-release-packages"
          test "$(find "$RUNNER_TEMP/scale-release-packages" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1

      - name: Upload prebuilt plugin tarball
        uses: actions/upload-artifact@v4
        with:
          name: scale-release-plugin-\${{ github.ref_name }}
          path: \${{ runner.temp }}/scale-release-packages/*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@hongmaple0820/scale-engine@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "scale-engine@$LOCAL already published — skipping (release completed out-of-band)."
          else
            npm publish --access public --provenance
          fi

      - name: Verify published package from npm registry
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SMOKE_ROOT="$RUNNER_TEMP/scale-registry-smoke"
          PROJECT_DIR="$SMOKE_ROOT/project"
          EVIDENCE_DIR="$RUNNER_TEMP/scale-release-evidence"
          mkdir -p "$PROJECT_DIR" "$EVIDENCE_DIR"
          npm install --prefix "$SMOKE_ROOT" --no-audit --no-fund "@hongmaple0820/scale-engine@$VERSION"
          SCALE_BIN="$SMOKE_ROOT/node_modules/.bin/scale"
          "$SCALE_BIN" version --json > "$EVIDENCE_DIR/registry-version.json"
          "$SCALE_BIN" install --dir "$PROJECT_DIR"
          "$SCALE_BIN" doctor --dir "$PROJECT_DIR" --json > "$EVIDENCE_DIR/registry-doctor.json"
          cp dist/release-manifest.json "$EVIDENCE_DIR/release-manifest.json"
          npm pack --dry-run --json > "$EVIDENCE_DIR/npm-pack-files.json"
          node --input-type=module - "$EVIDENCE_DIR" "$VERSION" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [dir, version] = process.argv.slice(2)
          const manifest = JSON.parse(readFileSync(join(dir, 'registry-version.json'), 'utf8'))
          const doctor = JSON.parse(readFileSync(join(dir, 'registry-doctor.json'), 'utf8'))
          const pack = JSON.parse(readFileSync(join(dir, 'npm-pack-files.json'), 'utf8'))
          if (manifest.package?.version !== version) throw new Error('Registry CLI version does not match the release tag')
          if (!/^[a-f0-9]{40}$/i.test(manifest.source?.commit ?? '')) throw new Error('Registry release manifest does not contain a full Git SHA')
          if (doctor.overall === 'broken') throw new Error('Registry-installed package doctor reports broken')
          const files = new Set((pack[0]?.files ?? []).map(file => file.path))
          if (!files.has('dist/release-manifest.json')) throw new Error('Release tarball omits dist/release-manifest.json')
          NODE
          printf 'tag=%s\ncommit=%s\nrun_id=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$EVIDENCE_DIR/provenance.txt"

      - name: Upload release evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-release-evidence-${{ github.ref_name }}
          path: ${{ runner.temp }}/scale-release-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Extract changelog section for this version
          NOTES=$(awk "/^## ${VERSION} -/{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "${NOTES:-Release v${VERSION}}"
          fi

  publish-plugin:
    name: Publish dsh-scale plugin
    runs-on: ubuntu-latest
    environment: npm
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Download prebuilt plugin tarball
        uses: actions/download-artifact@v4
        with:
          name: scale-release-plugin-\${{ github.ref_name }}
          path: \${{ runner.temp }}/scale-release-packages

      - name: Publish plugin
        working-directory: packages/dsh-scale
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          TARBALL=$(find "$RUNNER_TEMP/scale-release-packages" -maxdepth 1 -name '*.tgz' -print -quit)
          if [ -z "$TARBALL" ]; then
            echo "::error::Prebuilt dsh-scale tarball artifact is missing."
            exit 1
          fi
          PUBLISHED=$(npm view "@hongmaple0820/dsh-scale@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "dsh-scale@$LOCAL already published — skipping."
          else
            npm publish "$TARBALL" --access public
          fi
          REGISTRY_VERSION=$(npm view "@hongmaple0820/dsh-scale@$LOCAL" version)
          if [ "$REGISTRY_VERSION" != "$LOCAL" ]; then
            echo "::error::Registry plugin version $REGISTRY_VERSION does not match expected $LOCAL."
            exit 1
          fi

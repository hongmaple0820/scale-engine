name: Performance Baseline

on:
  schedule:
    - cron: '0 0 * * 1'    # Weekly, Monday 00:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Gate mode to measure'
        required: false
        default: 'fast-lane'
        type: choice
        options: [fast-lane, workflow, all]
      runs:
        description: 'Number of measurement runs'
        required: false
        default: '3'
        type: number

concurrency:
  group: performance-baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Measure gate performance
        run: |
          bash scripts/performance/measure-gates.sh \
            --runs ${{ inputs.runs || 3 }} \
            --mode ${{ inputs.mode || 'fast-lane' }} \
            --output performance-trend.csv

      - name: Regression alert
        # Compare each gate's latest sample with earlier samples from this measurement.
        # Emits ::warning:: if any gate degrades by more than 20%.
        run: |
          node - <<'EOF'
          const fs = require('fs')
          const rows = fs.readFileSync('performance-trend.csv', 'utf8')
            .trim().split('\n').map(r => r.split(','))
          const data = rows.slice(1)
          const byGate = new Map()
          for (const [run, gate, duration, status] of data) {
            if (status !== 'pass') continue
            const current = parseFloat(duration)
            if (isNaN(current)) continue
            if (!byGate.has(gate)) byGate.set(gate, [])
            byGate.get(gate).push({ run, duration: current })
          }
          for (const [gate, samples] of byGate) {
            if (samples.length < 2) continue
            const latest = samples[samples.length - 1]
            const window = samples.slice(Math.max(0, samples.length - 5), -1)
            const vals = window.map(s => s.duration)
            const avg = vals.reduce((a,b) => a+b, 0) / vals.length
            const current = latest.duration
            if (avg <= 0) {
              if (current > 0) {
                console.log(`::warning::Performance regression in ${gate}: ${current.toFixed(0)}ms vs avg 0ms`)
              }
              continue
            }
            const regression = (current - avg) / avg
            if (regression > 0.20) {
              console.log(`::warning::Performance regression in ${gate}: ${current.toFixed(0)}ms vs avg ${avg.toFixed(0)}ms (+${(regression*100).toFixed(1)}%)`)
            }
          }
          EOF

      - name: Upload performance data
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ github.run_number }}
          path: performance-trend.csv
          retention-days: 90

      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add performance-trend.csv
          if ! git diff --cached --quiet; then
            git commit -m "perf: update gate performance baseline [skip ci]"
            git push origin HEAD:master
          fi

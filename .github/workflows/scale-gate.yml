name: Published Package Gate Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, master]

concurrency:
  group: scale-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  published-package-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install source dependencies
        run: npm ci

      - name: Governance health
        run: |
          npm run learning:health
          npm run docs:health

      - name: Install published SCALE Engine
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          npm install -g "@hongmaple0820/scale-engine@${PKG_VERSION}" || \
            npm install -g @hongmaple0820/scale-engine@latest

      - name: Run published package preflight gates
        id: gates
        run: |
          scale preflight --json --profile ci --preflight-profile ci 2>&1 | tee scale-gates.json
          echo "## SCALE Gate Results" >> $GITHUB_STEP_SUMMARY
          cat scale-gates.json >> $GITHUB_STEP_SUMMARY

      - name: Upload Gate Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-gate-${{ matrix.os }}-evidence
          path: |
            .scale/evidence/
            scale-gates.json
          retention-days: 30

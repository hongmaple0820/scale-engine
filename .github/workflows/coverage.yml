name: Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage threshold check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run coverage
        # Uses the targeted coverage script (fast: only GateCatalog + VerificationProfile)
        # for PR speed. Full coverage available via 'npm run coverage' locally.
        # Vitest exits non-zero if any threshold (lines/functions/branches/statements: 80%)
        # is breached, enforcing the PR template checklist claim.
        run: npm run coverage

      - name: Append coverage summary
        if: github.event_name == 'pull_request'
        run: |
          # Parse json-summary reporter output and append it to the step summary.
          if [ -f coverage/coverage-summary.json ]; then
            node - <<'EOF'
          const s = require('./coverage/coverage-summary.json').total
          const fmt = (m) => `${m.pct.toFixed(1)}% (${m.covered}/${m.total})`
          const rows = [
            '| Metric | Coverage |',
            '|--------|----------|',
            `| Lines | ${fmt(s.lines)} |`,
            `| Functions | ${fmt(s.functions)} |`,
            `| Branches | ${fmt(s.branches)} |`,
            `| Statements | ${fmt(s.statements)} |`,
          ]
          const md = ['## Coverage Report', '', ...rows].join('\n')
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n')
          EOF
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
